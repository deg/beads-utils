name: lint

# Lint + smoke test + the pytest suite for the collection. Runs on direct
# pushes to main (the maintainer's workflow) and on pull requests.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # allow manual runs (gh workflow run lint.yml)

# Both jobs delegate to the Makefile rather than spelling out commands here.
# That keeps one definition of "how you lint" and "how you test": a contributor
# runs `make check` / `make test` locally and gets exactly what CI runs, and
# the pinned tool versions live in one place (the Makefile) instead of drifting
# between this file and the docs.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.1.0   # setup-uv ships only full-version tags (no moving @v8)
        with:
          enable-cache: false   # no lock files in this repo to key a cache on
      # ruff over every script (discovered by shebang), the shared helper
      # modules, and the test suite — plus a --version smoke test of each
      # script, since ruff is static-only and won't catch an import or
      # argparse break. bd-view runs via its `uv run --script` shebang there,
      # which nothing else exercises.
      - name: make check
        run: make check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.1.0   # see the check job for why the tag is pinned
        with:
          enable-cache: false
      # `uv run --with` resolves the test dependencies into a throwaway
      # environment, so the repo keeps its no-package / no-build-step shape:
      # no pyproject.toml, no lock file, nothing installed globally.
      - name: make test
        run: make test
