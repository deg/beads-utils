name: lint

# Single lint check for the collection. Runs on direct pushes to main (the
# maintainer's workflow) and on pull requests (contributors).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Lint bdutils.py plus every script (discovered by its shebang, so new
      # scripts are picked up automatically). ruff is pinned for reproducible
      # CI; bump the version here deliberately.
      - name: ruff check
        run: uvx ruff@0.15.14 check bdutils.py $(grep -lE '^#!' * 2>/dev/null)
